        };

    <!-- === PAGE SETTINGS === -->
    <title>Norm - Sign in</title>
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />
    <meta
      name="description"
      content="Track calories and macros with Norm's curated database and personalize your dashboard with widgets to monitor supplements, weight, and more."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Norm" />
    <meta
      property="og:description"
      content="Track calories and macros with Norm's curated database and personalize your dashboard with widgets to monitor supplements, weight, and more."
    />
    <meta
      property="og:image"
      content="https://tracknorm.com/assets/social-preview.png"
    />
    <meta property="og:url" content="https://tracknorm.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norm" />
    <meta
      name="twitter:description"
      content="Track calories and macros with Norm's curated database and personalize your dashboard with widgets to monitor supplements, weight, and more."
    />
    <meta
      name="twitter:image"
      content="https://tracknorm.com/assets/social-preview.png"
    />

    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="shortcut icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="css/add-food.css" />
    <link rel="stylesheet" href="css/modal-temp.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/food-log.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/macros-sum.css" />
    <link rel="stylesheet" href="css/widgets.css" />
    <link rel="stylesheet" href="css/settings.css" />
  </head>

  <body>
    <!-- pin -->

    <div class="landing-page" id="auth-screen">
      <div class="landing-layout">
        <div class="landing-title-vert">
          <span class="landing-title-white">Make healthy</span>
          <div class="landing-title-hor">
            <span class="landing-title-white">the&nbsp;</span>
            <span class="landing-title-orange">norm</span>
          </div>
        </div>

        <span class="landing-subtitle"
          >Track your macros with a curated database at no cost and customize
          your widgets to monitor supplements, weight, and more.
        </span>
        <div class="big-wrap">
          <div class="form-wrap" id="form-wrap">
            <form
              class="input-box"
              style="display: flex"
              id="auth-form"
              onsubmit="return handleAuthSubmit(event);"
            >
              <input
                id="auth-email"
                class="pin-input"
                type="email"
                placeholder="Email"
                autocomplete="email"
              />
              <div class="password-wrap">
                <input
                  id="auth-password"
                  class="pin-input"
                  type="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                />

                <span
                  id="password-toggle-icon"
                  class="eye-toggle"
                  data-icon="eye-closed"
                  onclick="togglePasswordVisibility()"
                ></span>
              </div>
            </form>
            <div class="forgot-pass">
              <span
                class="toggle-text"
                href="#"
                onclick="
                  handleForgotPassword();
                  return false;
                "
                >Forgot password?</span
              >
            </div>

            <div id="auth-error" class="error-caption"></div>

            <button
              id="auth-submit-btn"
              class="sign-button"
              onclick="submitAuth()"
            >
              Sign in
            </button>

            <div class="signinup-wrap">
              <span class="signinup-link-text" id="auth-toggle-text">
                Don't have an account?
              </span>
              <span
                class="signinup-link"
                id="auth-toggle-link"
                onclick="
                  toggleAuthMode();
                  return false;
                "
              >
                Sign up
              </span>
            </div>
          </div>
          <div id="pin-loading" style="display: none">
            <div class="loading-spinner"></div>
          </div>

          <div class="guest-wrap">
            <button class="guest-button" onclick="enterGuestMode()">
              <span>Try it as guest</span>
              <span data-icon="doorOpen" class="guest-svg"></span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="js/shared/firebase.js"></script>
    <script src="js/shared/papaparse.min.js"></script>
    <script src="js/shared/icons.js"></script>
    <script src="js/solo/auth.js"></script>
  </body>
</html>
